services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: servora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - servora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servora"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  servora-postgres:
